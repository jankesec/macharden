<!doctype html>
<!-- Social preview card (1280x640), rendered by scripts/generate_static_assets.py.
     It embeds assets/dashboard.png, so regenerate both together with `make demo`. -->
<html lang="en">
<head>
<meta charset="utf-8">
<title>macharden social preview</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1280px; height: 640px; overflow: hidden; }
  body {
    position: relative;
    color: #f5f7fb;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Helvetica Neue", Arial, sans-serif;
    background: radial-gradient(900px 520px at 0% 0%, #1a2433 0%, #0b0f16 55%, #07090d 100%);
  }
  .left { position: absolute; left: 70px; top: 56px; width: 470px; }
  .eyebrow { font-size: 16px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: #5aa2ff; }
  h1 { margin-top: 20px; font-size: 72px; line-height: 1; font-weight: 800; letter-spacing: -0.02em; }
  .lede { margin-top: 18px; font-size: 24px; line-height: 1.35; color: #9aa6bb; }
  ul { margin-top: 28px; display: grid; gap: 12px; justify-items: start; list-style: none; }
  li {
    display: inline-flex; align-items: center; gap: 14px;
    padding: 10px 20px; border-radius: 10px;
    font-size: 19px; font-weight: 600;
    background: rgba(255, 255, 255, .05); border: 1px solid rgba(255, 255, 255, .10);
  }
  li::before { content: "\2713"; color: #34d399; font-weight: 800; }
  .cmd {
    position: absolute; left: 70px; bottom: 48px; width: 480px; padding: 20px 22px; border-radius: 10px; white-space: nowrap;
    background: #090d14; border: 2px solid #22c55e;
    font: 600 18px ui-monospace, "SF Mono", Menlo, monospace; color: #7db3ff;
  }
  .cmd span { margin-right: 10px; color: #8b95a7; }
  .shot {
    position: absolute; left: 570px; top: 120px; width: 670px; overflow: hidden; border-radius: 14px;
    box-shadow: 0 30px 80px rgba(0, 0, 0, .55), 0 0 0 1px rgba(255, 255, 255, .08);
  }
  .shot img { display: block; width: 100%; }
</style>
</head>
<body>
  <div class="left">
    <div class="eyebrow">macOS security audit</div>
    <h1>macharden</h1>
    <p class="lede">Read-only CIS &amp; NIST audit, baseline drift detection and CI gates for macOS.</p>
    <ul>
      <li>54 CIS &amp; NIST controls</li>
      <li>No third-party dependencies</li>
      <li>OASIS SARIF v2.1.0 output</li>
      <li>Single-file HTML dashboard</li>
    </ul>
  </div>
  <div class="cmd"><span>$</span>brew install jankesec/tap/macharden</div>
  <div class="shot"><img src="../assets/dashboard.png" alt=""></div>
</body>
</html>
